name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # base = domyślna instalacja, bez bibliotek natywnych. Musi być zielona sama,
        # bo to wariant, który dostaje każdy po `uv tool install ksef-invoice`.
        variant: [base, pdf]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: pango (tylko wariant pdf)
        if: matrix.variant == 'pdf'
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install pango
          else
            sudo apt-get update
            sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
          fi

      - name: Zależności
        run: uv sync --locked ${{ matrix.variant == 'pdf' && '--extra pdf' || '--exact' }}

      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest

      - name: Bez extry PDF nie powstaje, ale HTML musi
        if: matrix.variant == 'base'
        run: |
          uv run python -c "
          from ksef_invoice.visualize import pdf_status, to_html, to_pdf, PDF_NO_EXTRA
          xml = open('tests/fixtures/two_lines.xml','rb').read()
          assert pdf_status() == PDF_NO_EXTRA, pdf_status()
          assert to_pdf(xml) is None
          html = to_html(xml).decode()
          assert '@page' in html and 'A4 landscape' in html, 'HTML bez CSS druku'
          print('base OK: HTML z CSS druku, PDF pominiety')
          "

      - name: PDF musi naprawdę powstać
        if: matrix.variant == 'pdf'
        run: |
          uv run python -c "
          from ksef_invoice.visualize import pdf_status, to_pdf
          assert pdf_status() == 'ok', pdf_status()
          pdf = to_pdf(open('tests/fixtures/two_lines.xml','rb').read())
          assert pdf and pdf.startswith(b'%PDF'), 'brak PDF-a'
          print('pdf OK:', len(pdf), 'bajtow')
          "

  # Osobny job, bo to JEDYNY sposób, żeby regresja poprawki pango kiedykolwiek się
  # ujawniła: pod Pythonem z Homebrew ctypes ma załataną listę DEFAULT_LIBRARY_FALLBACK
  # i PDF działa nawet bez naszej poprawki. Czysty CPython (taki, jaki pobiera uv
  # użytkownikowi) jej nie ma — i właśnie tam bug był widoczny.
  managed-python-pdf:
    name: macOS / czysty CPython + pango
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: brew install pango
      - run: uv sync --locked --extra pdf --python-preference only-managed
      - name: ctypes nie ma prefiksu Homebrew, a PDF i tak powstaje
        run: |
          uv run python -c "
          import ctypes.macholib.dyld as dyld, sys
          print('interpreter:', sys.executable)
          print('fallback przed importem:', dyld.DEFAULT_LIBRARY_FALLBACK)
          from ksef_invoice.visualize import to_pdf
          pdf = to_pdf(open('tests/fixtures/two_lines.xml','rb').read())
          assert pdf and pdf.startswith(b'%PDF'), 'poprawka pango przestala dzialac'
          print('OK:', len(pdf), 'bajtow')
          "
      - run: uv run pytest

  # Łapie klasę błędów niewidoczną dla pytesta: rzeczy, których nie ma w wheelu, i
  # ścieżki liczone względem drzewa źródeł. Dokładnie tak wyglądały dwa blokery
  # instalowalności (examples/.env.example i PROJECT_ROOT).
  wheel-smoke:
    name: Instalacja z wheela, od zera
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true

      - name: Zbuduj i przygotuj konkretną fakturę na wejście
        run: |
          uv build --out-dir dist
          uv sync --locked --exact
          uv run python -c "
          import sys; sys.path.insert(0,'tests')
          from pathlib import Path
          from support import write_concrete_invoice
          print(write_concrete_invoice(Path('/tmp')))
          "

      - name: Zainstaluj jak użytkownik
        run: uv tool install --force dist/*.whl

      - name: Onboarding z katalogu bez repo
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/praca && cd /tmp/praca      # cwd celowo != home
          HOME_DIR=/tmp/dane

          ksef-invoice --version
          ksef-invoice --home "$HOME_DIR" init --nip 1111111111
          test "$(stat -c '%a' "$HOME_DIR")" = 700
          test "$(stat -c '%a' "$HOME_DIR/.env")" = 600

          ksef-invoice --home "$HOME_DIR" templatize /tmp/faktura-z-ksef.xml \
            --name klient --write-config --due-days 14
          test -f "$HOME_DIR/templates/klient.xml"
          test ! -d /tmp/praca/templates            # nie zapisuje względem cwd

          ksef-invoice --home "$HOME_DIR" doctor
          ksef-invoice --home "$HOME_DIR" profiles | grep -q klient
          # Pusty rejestr to kod 0, nie błąd — a `list` musi to powiedzieć bez tracebacku.
          ksef-invoice --home "$HOME_DIR" list | grep -q "Brak wystawionych faktur"

          ksef-invoice --home "$HOME_DIR" render --profile klient --month 2026-07 --net 1000
          test -f "$HOME_DIR"/out/test/klient/2026-07_*/invoice.xml
          test -f "$HOME_DIR"/out/test/klient/2026-07_*/invoice.html
          # `path` musi dać dokładnie jedną linię, którą da się podstawić w shellu.
          test "$(ksef-invoice --home "$HOME_DIR" path --month 2026-07 | wc -l)" -eq 1
          test -d "$(ksef-invoice --home "$HOME_DIR" path --month 2026-07)"

      - name: python -m i --json też działają
        run: |
          set -eux
          export PATH="$HOME/.local/bin:$PATH"
          ksef-invoice --home /tmp/dane doctor --json | uv run python -c "
          import json, sys
          payload = json.load(sys.stdin)
          assert payload['failed'] == 0, payload
          assert payload['home'] == '/tmp/dane', payload['home']
          print('doctor --json OK')
          "

# Poglądowy config — pokazuje wszystkie opcje z komentarzami.
#
# Nie kopiuj go ręcznie: `ksef-invoice init --nip <NIP>` tworzy właściwy
# ~/.ksef-invoice/config.toml (wzorzec jest wbudowany w kod), a profile dopisuje
# `ksef-invoice templatize ... --write-config`. Ten plik jest tylko dokumentacją
# czytelną na GitHubie i narzędzie go nie czyta.

# NIP sprzedawcy — kontekst uwierzytelnienia w KSeF (wspólny dla wszystkich profili).
nip = "1111111111"

# Wspólna numeracja (roczna sekwencja dla wszystkich profili).
# Tokeny: {seq} (licznik), {year} (2026), {month} (7), {month02} (07).
# Licznik trzyma out/ledger.json; zasiej/skoryguj go flagą --seq przy wysyłce.
number_format = "FS/{seq}/{year}"

# Domyślne ustawienia profili (każdy profil może je nadpisać):
# Stawka VAT w procentach (musi zgadzać się z P_12 w szablonie) albo "np" —
# faktura bez VAT (nie podlega, np. odwrotne obciążenie UE): brutto = netto.
vat_rate = "23"
# Dzień wystawienia (P_1):
#   "today" = dzień uruchomienia skryptu (bezpieczny domyślny — KSeF odrzuca daty z przyszłości),
#   "last"  = ostatni dzień miesiąca (wymaga uruchomienia najwcześniej tego dnia),
#   liczba  = konkretny dzień miesiąca (np. 28).
issue_day = "today"
# Termin płatności — dokładnie jedna z reguł:
#   due_days = N            → termin = data wystawienia + N dni
#   due_day_next_month = D  → termin = D. dzień miesiąca po miesiącu rozliczeniowym (P_6)
due_days = 14

# Profile — jedna powtarzalna faktura = jeden profil z własnym szablonem FA(3).
# Kwoty pozycji podaje się przy wysyłce: --net <pozycja1> [--net <pozycja2> ...],
# a w szablonie odpowiadają im placeholdery {{line1_net}}, {{line2_net}}, ...
#
# Ścieżka `template` jest względna do katalogu roboczego (~/.ksef-invoice), więc
# w prawdziwym configu wygląda jak "templates/<profil>.xml" — tak ją zapisuje
# `templatize --write-config`. NIP 1111111111 poniżej to atrapa zgodna z
# examples/template.example.xml; na środowisku testowym KSeF taki NIP bywa „zużyty"
# przez innych integratorów i faktura wraca z kodem 440, więc użyj swojego.
[profiles.demo]
template = "templates/demo.xml"
due_day_next_month = 15

# Tak wygląda drugi profil — faktura bez VAT (odwrotne obciążenie dla kontrahenta z UE)
# i termin liczony od daty wystawienia:
# [profiles.klient-b]
# template = "templates/klient-b.xml"
# vat_rate = "np"
# due_days = 30

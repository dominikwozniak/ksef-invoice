[project]
name = "ksef-invoice"
version = "1.0.0"
description = "Wystawianie powtarzalnych faktur sprzedażowych w KSeF (API 2.0, FA(3))"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Dominik Woźniak" }
]
requires-python = ">=3.12"
keywords = ["ksef", "faktura", "invoice", "fa3", "e-invoicing", "poland"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Polish",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Accounting",
]
# lxml i rich są importowane wprost (invoice.py, templatize.py, cli.py) — dotąd wchodziły
# tylko tranzytywnie przez signxml i typera, więc każdy ich bump mógł urwać nam import.
dependencies = [
    "ksef2>=0.18.1",
    "lxml>=6.0",
    "rich>=13",
    "typer>=0.27.0",
]

# PDF jest opcjonalny, bo WeasyPrint wymaga bibliotek natywnych (pango), których nie da
# się zainstalować pipem. Domyślna instalacja ma zero zależności systemowych; bez tego
# extra `render`/`send` zapisują sam invoice.html (patrz visualize.to_pdf).
[project.optional-dependencies]
pdf = ["ksef2[pdf]>=0.18.1"]

[project.urls]
Homepage = "https://github.com/dominikwozniak/ksef-invoice"
Repository = "https://github.com/dominikwozniak/ksef-invoice"
Issues = "https://github.com/dominikwozniak/ksef-invoice/issues"
Changelog = "https://github.com/dominikwozniak/ksef-invoice/blob/main/CHANGELOG.md"

[project.scripts]
ksef-invoice = "ksef_invoice.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# typer.Option/Argument w wartościach domyślnych to wzorzec Typera, nie błąd (B008).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
